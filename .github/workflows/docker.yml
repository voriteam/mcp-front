name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-docker-image-${{ github.sha }}

env:
  image: us-docker.pkg.dev/vori-1bdf0/services/mcp-front

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to the Vori Artifact Registry with a stored service
      # account key (GCP_SA_KEY secret), via the _json_key docker login —
      # the same stored-secret pattern the workflow already used for Docker Hub.
      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.image }}
          # The full 40-char commit SHA tag is what ArgoCD Image Updater
          # matches (regex ^[0-9a-f]{40}$, newest-build strategy).
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: BUILD_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
